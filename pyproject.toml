[project]
name = "dbpeek"
version = "0.1.0"
description = "CLI tool for quickly inspecting a db instance, it's tables and the stored data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.3",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
