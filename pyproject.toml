[project]
name = "dbpeek"
version = "0.1.0"
description = "CLI tool for quickly inspecting a db instance, it's tables and the stored data"
authors = [
  { name="Simon Schmitz", email="simonstz3000@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.3",
    "typer>=0.27.2",
]
license = "MIT"
license-files = ["LICENSE.md"]

[project.urls]
Homepage = "https://github.com/Simon-scm/dbpeek"
Issues = "https://github.com/Simon-scm/dbpeek/issues"
Developer-Homepage = "https://simonscm.dev/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
dbpeek = "dbpeek.cli:app"
dbpk = "dbpeek.cli:app"

[tool.setuptools.packages.find]
where = ["src"]